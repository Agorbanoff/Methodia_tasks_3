spring:
  application:
    name: mini-billing-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mini_billing}
    username: ${DB_USERNAME:mini_billing_user}
    password: ${DB_PASSWORD:mini_billing_password}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 6969

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  security:
    jwt-secret: ${APP_SECURITY_JWT_SECRET:mini-billing-development-secret-key-change-me-please}
    jwt-expiration-seconds: ${APP_SECURITY_JWT_EXPIRATION_SECONDS:86400}
    cookie-secure: ${APP_SECURITY_COOKIE_SECURE:false}
  audit:
    log-file: ${APP_AUDIT_LOG_FILE:logs/audit.log}
