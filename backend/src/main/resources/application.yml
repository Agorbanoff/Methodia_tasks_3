spring:
  application:
    name: mini-billing-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/mini_billing
    username: mini_billing_user
    password: mini_billing_password
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 6969

billing:
  input-directory: ../data/input
  output-directory: ../data/output
